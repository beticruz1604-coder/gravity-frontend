# CI del front (trigger de Cloud Build en cada pull request hacia main): dependencias, lint, compilación, prueba de humo en
# navegador y pruebas del proxy de nginx (lista de rutas, límites y cabeceras de seguridad).
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
steps:
  - id: instalar
    name: node:22-bookworm-slim
    entrypoint: npm
    args: ["ci", "--no-audit", "--no-fund"]

  - id: lint
    name: node:22-bookworm-slim
    entrypoint: npm
    args: ["run", "lint"]

  - id: compilar
    name: node:22-bookworm-slim
    entrypoint: npm
    args: ["run", "build"]

  # Segundo build, con el inicio de sesión de usuario y contraseña, para la prueba tests/login.mjs.
  - id: compilar-lab
    name: node:22-bookworm-slim
    entrypoint: npm
    args: ["run", "build", "--", "--outDir", "dist-lab"]
    env: ["VITE_IDENTITY_PROVIDER=lab"]

  - id: humo
    name: mcr.microsoft.com/playwright:v1.49.0-noble
    entrypoint: bash
    args: ["-c", "npm i --no-save --no-audit --no-fund playwright@1.49.0 && { node tests/smoke.mjs; a=$$?; node tests/docs-viewer.mjs; b=$$?; node tests/homologation-reference.mjs; c=$$?; node tests/access.mjs; d=$$?; node tests/login.mjs; e=$$?; [ $$a -eq 0 ] && [ $$b -eq 0 ] && [ $$c -eq 0 ] && [ $$d -eq 0 ] && [ $$e -eq 0 ]; }"]

  - id: proxy
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["tests/proxy-allowlist.sh"]
    env: ["DOCKER_NETWORK=cloudbuild"]
